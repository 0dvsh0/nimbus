<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>X / Twitter Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000000;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 30px 16px;
      min-height: 100vh;
    }
    .feed-container {
      width: 600px;
      border: 1px solid #2f3336;
      border-radius: 16px;
      background: #000000;
      overflow: hidden;
    }
    .tweet-mock-thread {
      padding: 20px 24px;
      border-bottom: 1px solid #2f3336;
    }
    .author-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7928ca, #ff0080);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      font-size: 16px;
    }
    .author-meta {
      display: flex;
      flex-direction: column;
    }
    .name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .author-name {
      font-weight: 700;
      font-size: 15px;
      color: #e7e9ea;
    }
    .badge {
      color: #1d9bf0;
      font-size: 14px;
    }
    .author-handle {
      color: #71767b;
      font-size: 14px;
    }
    .tweet-text {
      font-size: 17px;
      line-height: 1.45;
      color: #e7e9ea;
      margin-bottom: 14px;
    }
    .tweet-metrics {
      display: flex;
      gap: 28px;
      color: #71767b;
      font-size: 13px;
      padding-top: 12px;
      border-top: 1px solid #2f3336;
    }
    .composer-section {
      padding: 20px 24px 34px 24px;
      position: relative;
    }
    .replying-to {
      color: #71767b;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .replying-to span {
      color: #1d9bf0;
    }
    .composer-row {
      display: flex;
      gap: 12px;
    }
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #3f2063;
      border: 1px solid #8655b0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: #c8aed6;
    }
    .composer-input-box {
      flex: 1;
      position: relative;
    }
    .tweet-editor {
      min-height: 90px;
      padding: 10px 14px;
      background: #0b0612;
      border: 1px solid #3f2063;
      border-radius: 12px;
      color: #f4ebef;
      font-size: 16px;
      line-height: 1.45;
      outline: none;
      word-break: break-word;
      transition: border-color 0.2s ease;
    }
    .tweet-editor:focus {
      border-color: #8655b0;
      box-shadow: 0 0 16px rgba(134, 85, 176, 0.35);
    }
    .tweet-editor:empty:before {
      content: "Post your reply...";
      color: #71767b;
      pointer-events: none;
    }
    .bottom-bar {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }
    .reply-btn {
      background: #1d9bf0;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="feed-container">
    <article class="tweet-mock-thread" data-testid="tweet">
      <div class="author-row">
        <div class="avatar">AK</div>
        <div class="author-meta">
          <div class="name-row">
            <span class="author-name" data-testid="User-Name">Ava Kim</span>
            <span class="badge">✔</span>
            <span class="author-handle">@avakim · 2h</span>
          </div>
        </div>
      </div>
      <div class="tweet-text" data-testid="tweetText">
        Just shipped my first indie app after 14 months of nights & weekends. Terrified and thrilled.
      </div>
      <div class="tweet-metrics">
        <span>💬 48 Replies</span>
        <span>🔁 124 Reposts</span>
        <span>❤️ 892 Likes</span>
      </div>
    </article>

    <div class="composer-section">
      <div class="replying-to">Replying to <span>@avakim</span></div>
      <div class="composer-row">
        <div class="user-avatar">YOU</div>
        <div class="composer-input-box">
          <div class="tweet-editor" 
               id="tweet-editor"
               data-testid="tweetTextarea_0" 
               contenteditable="true" 
               role="textbox" 
               aria-multiline="true"></div>
          <div class="bottom-bar">
            <button class="reply-btn">Reply</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
